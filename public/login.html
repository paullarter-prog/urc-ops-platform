<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In — URC Ops Platform</title>
<link rel="icon" type="image/png" href="logos/urc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --urc-dark:#0a1e2d; --urc-dark-2:#142837; --urc-turquoise:#00cde6; }
  body { font-family:'Red Hat Display',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--urc-dark); }
  .card { width:100%; max-width:360px; background:#fff; border-radius:12px; border-top:4px solid var(--urc-turquoise); box-shadow:0 8px 30px rgba(0,0,0,0.25); padding:32px; box-sizing:border-box; }
  .urc-logo { display:block; height:34px; margin:0 0 20px; }
  h1 { font-size:1.05rem; font-weight:500; color:#7a8590; margin:0 0 4px; }
  p.sub { font-size:0.85rem; color:#7a8590; margin:0 0 24px; }
  form { display:grid; gap:14px; }
  label { display:block; font-weight:500; font-size:0.85rem; margin-bottom:4px; color:var(--urc-dark); }
  input { width:100%; padding:9px; font-size:1rem; font-family:inherit; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  input:focus { outline:2px solid var(--urc-turquoise); outline-offset:1px; border-color:var(--urc-turquoise); }
  button { padding:10px 18px; font-size:1rem; font-family:inherit; font-weight:500; background:var(--urc-dark); color:#fff; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:var(--urc-dark-2); }
  #message { margin-top:14px; padding:10px; border-radius:6px; display:none; font-size:0.85rem; }
  #message.error { display:block; background:#fdecea; color:#b3261e; }
</style>
</head>
<body>
<div class="card">
  <img src="logos/urc-logo.png" alt="United Rugby Championship" class="urc-logo">
  <h1>Ops Platform</h1>
  <p class="sub">Sign in to continue</p>
  <form id="login-form">
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" required autofocus>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit">Sign In</button>
  </form>
  <div id="message"></div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('message');
  message.className = '';
  message.textContent = '';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    window.location.href = '/dashboard.html';
  } catch (err) {
    message.className = 'error';
    message.textContent = err.message;
  }
});
</script>
</body>
</html>
