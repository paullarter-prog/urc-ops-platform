function renderThreadList(){
  const sections=[
    {label:'Match day groups',types:['matchday']},
    {label:'Round & group',types:['round','group']},
    {label:'Direct messages',types:['direct']},
  ];
  let html='';
  sections.forEach(s=>{
    const threads=THREADS.filter(t=>s.types.includes(t.type));
    if(!threads.length)return;
    html+=`<div class="thread-section">${s.label}</div>`;
    threads.forEach(t=>{
      html+=`<div class="thread-item ${t.unread?'unread':''} ${activeThread===t.id?'active':''}" onclick="openThread('${t.id}')">
        <div class="t-avatar ${t.av}">${t.init}</div>
        <div class="t-body">
          <div class="t-top"><span class="thread-name">${t.name}</span><span class="t-time">${t.time}</span></div>
          <div class="t-preview">${t.preview}</div>
          <div class="t-badges">${t.unread?`<span class="unread-badge">${t.unread}</span>`:''}<span class="${t.tag}">${t.type==='matchday'?'Match day':t.type==='round'?'Round group':t.type==='group'?'Group':'Direct'}</span></div>
        </div>
      </div>`;
    });
  });
  document.getElementById('thread-list').innerHTML=html;
}

function openThread(id){
  activeThread=id;
  const t=THREADS.find(x=>x.id===id);
  t.unread=0;
  renderThreadList();
  renderChat(t);
  renderCol3(t);
  document.getElementById('input-area').style.display='';
  document.getElementById('msg-input').placeholder=`Message ${t.name}...`;
}

function renderChat(t){
  const avInit=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
  document.getElementById('chat-header').innerHTML=`
    <div class="ch-avatar ${t.av}">${t.init}</div>
    <div class="ch-info"><div class="ch-name">${t.name}</div><div class="ch-meta">${t.meta}</div></div>
    <div style="display:flex;gap:6px">
      <div class="icon-btn" title="Members"><i class="ti ti-users" aria-hidden="true"></i></div>
      <div class="icon-btn" title="Shared files" onclick="switchCol3('docs',document.getElementById('tab-docs'))"><i class="ti ti-paperclip" aria-hidden="true"></i></div>
    </div>`;

  let html='<div class="day-divider">Today</div>';
  t.messages.forEach(m=>{
    const isMe=m.from==='pl';
    if(m.type==='system'){
      html+=`<div style="display:flex;justify-content:center"><div class="msg-bubble system">${m.text}</div></div>`;
      return;
    }
    const docHtml=m.type==='doc'?`<div class="doc-card ${isMe?'mine-card':''}">
      <div class="doc-icon ${m.docIcon}"><i class="ti ti-file-description" aria-hidden="true"></i></div>
      <div class="doc-card-info">
        <div class="dc-name">${m.docName}</div>
        <div class="dc-meta">${m.docMeta}</div>
        <span class="dc-badge ${m.docBadge}">${m.docBadgeLabel}</span>
      </div>
      <i class="ti ti-download" style="font-size:14px;color:${isMe?'#B5D4F4':'var(--color-text-tertiary)'};flex-shrink:0" aria-hidden="true"></i>
    </div>`:'';
    html+=`<div class="msg ${isMe?'mine':''}">
      ${!isMe?`<div class="msg-av ${m.av}">${avInit(m.name)}</div>`:''}
      <div class="msg-body">
        ${!isMe?`<div class="msg-name">${m.name}</div>`:''}
        ${m.text?`<div class="msg-bubble ${isMe?'mine':'theirs'}">${m.text}</div>`:''}
        ${docHtml}
        <div class="msg-time">${m.time}</div>
      </div>
      ${isMe?`<div class="msg-av av-blue">PL</div>`:''}
    </div>`;
  });
  const el=document.getElementById('messages');
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

function renderCol3(t){
  if(!t)return;
  if(col3Tab==='info'){
    let html='';
    if(t.fixture){
      html+=`<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px">Fixture</div>
        <div style="padding:10px;border-radius:var(--border-radius-md);background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);font-size:11px">
          <div style="font-weight:500;font-size:12px;margin-bottom:4px">${t.fixture.teams}</div>
          <div style="color:var(--color-text-secondary);margin-top:3px"><i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i> ${t.fixture.venue}</div>
          <div style="color:var(--color-text-secondary);margin-top:3px"><i class="ti ti-clock" style="font-size:11px" aria-hidden="true"></i> ${t.fixture.ko}</div>
        </div></div>`;
    }
    html+=`<div style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px">Members (${t.members.length})</div>`;
    t.members.forEach(m=>{
      html+=`<div class="member-row"><div class="mr-av ${m.av}">${m.init}</div><div><div class="mr-name">${m.name}</div><div class="mr-role">${m.role}</div></div></div>`;
    });
    document.getElementById('col3-content').innerHTML=html;
  } else {
    // docs tab
    let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.04em">Shared in this thread</div>
      <div style="font-size:10px;color:#185FA5;cursor:pointer" onclick="openModal('library')">+ Share</div>
    </div>`;
    if(!t.sharedDocs||!t.sharedDocs.length){
      html+='<div style="font-size:11px;color:var(--color-text-tertiary);padding:12px 0;text-align:center">No documents shared yet</div>';
    } else {
      t.sharedDocs.forEach(d=>{
        html+=`<div class="shared-doc-row">
          <div class="sdr-icon ${d.icon}"><i class="ti ti-file-description" aria-hidden="true"></i></div>
          <div class="sdr-info"><div class="sdr-name">${d.name}</div><div class="sdr-meta">${d.meta}</div></div>
          <span class="badge ${d.source==='platform'?'b-platform':'b-upload'}">${d.source==='platform'?'Platform':'Uploaded'}</span>
        </div>`;
      });
    }
    document.getElementById('col3-content').innerHTML=html;
  }
}

function switchCol3(tab,el){
  col3Tab=tab;
  document.querySelectorAll('.col3-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  const t=THREADS.find(x=>x.id===activeThread);
  if(t)renderCol3(t);
}

// Modal
function openModal(mode){
  if(!activeThread)return;
  modalMode=mode;
  selectedLibDoc=null;
  pendingUploadName=null;
  const overlay=document.getElementById('modal-overlay');
  overlay.style.display='flex';
  const titles={upload:'Upload a file',library:'Share from doc library',mddoc:'Link an MD Doc'};
  document.getElementById('modal-title').textContent=titles[mode]||'Share document';

  // tabs
  document.getElementById('modal-tabs').innerHTML=`
    <button class="mtab ${mode==='upload'?'on':''}" onclick="switchModalTab('upload',this)"><i class="ti ti-upload" aria-hidden="true"></i> Upload file</button>
    <button class="mtab ${mode==='library'?'on':''}" onclick="switchModalTab('library',this)"><i class="ti ti-library" aria-hidden="true"></i> Doc library</button>
    <button class="mtab ${mode==='mddoc'?'on':''}" onclick="switchModalTab('mddoc',this)"><i class="ti ti-file-description" aria-hidden="true"></i> MD Docs</button>`;
  renderModalBody(mode);
}

function switchModalTab(mode,el){
  modalMode=mode;
  selectedLibDoc=null;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderModalBody(mode);
}

function renderModalBody(mode){
  const body=document.getElementById('modal-body');
  if(mode==='upload'){
    body.innerHTML=`<div class="upload-area" onclick="simulateUpload()">
      <i class="ti ti-cloud-upload" aria-hidden="true"></i>
      <div style="font-weight:500;margin-bottom:4px">Click to upload a file</div>
      <div style="font-size:10px">PDF, Word, Excel supported · Max 50MB</div>
      ${pendingUploadName?`<div style="margin-top:10px;padding:8px 12px;background:#EAF3DE;border-radius:var(--border-radius-md);color:#27500A;font-size:11px">✓ ${pendingUploadName} ready to share</div>`:''}
    </div>`;
  } else if(mode==='library'||mode==='mddoc'){
    const label=mode==='mddoc'?'Match day documents':'All platform documents';
    const docs=mode==='mddoc'?PLATFORM_DOCS.filter(d=>d.name.includes('MD Pack')||d.name.includes('Briefing')):PLATFORM_DOCS;
    body.innerHTML=`<div style="font-size:10px;color:var(--color-text-tertiary);margin-bottom:8px">${label} — click to select</div>
      <div class="doc-lib">${docs.map(d=>`<div class="lib-item ${selectedLibDoc===d.id?'selected':''}" onclick="selectLibDoc('${d.id}')">
        <div class="lib-icon ${d.icon}"><i class="ti ${d.iconChar}" aria-hidden="true"></i></div>
        <div class="lib-info"><div class="lib-name">${d.name}</div><div class="lib-meta">${d.meta}</div></div>
        ${selectedLibDoc===d.id?'<i class="ti ti-check" style="color:#185FA5;font-size:16px" aria-hidden="true"></i>':''}
      </div>`).join('')}</div>`;
  }
}

function selectLibDoc(id){
  selectedLibDoc=id;
  renderModalBody(modalMode);
}

function simulateUpload(){
  const names=['Venue_Checklist_R19.pdf','Match_Report_Template.docx','Travel_Brief_Glasgow.pdf'];
  pendingUploadName=names[Math.floor(Math.random()*names.length)];
  renderModalBody('upload');
}

function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  selectedLibDoc=null;pendingUploadName=null;
}
function closeModalOverlay(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function shareDoc(){
  const t=THREADS.find(x=>x.id===activeThread);
  if(!t)return;
  let docName,docMeta,docIcon,docBadge,docBadgeLabel,source;
  if(modalMode==='upload'&&pendingUploadName){
    docName=pendingUploadName;docMeta='Uploaded · Just now';docIcon='di-doc';docBadge='dcb-upload';docBadgeLabel='Uploaded file';source='upload';
  } else if((modalMode==='library'||modalMode==='mddoc')&&selectedLibDoc){
    const d=PLATFORM_DOCS.find(x=>x.id===selectedLibDoc);
    if(!d)return;
    docName=d.name;docMeta=d.meta;docIcon=d.icon;docBadge=d.badge;docBadgeLabel=d.badgeLabel;source='platform';
  } else return;
  t.messages.push({id:'new'+Date.now(),from:'pl',name:'Paul L',av:'av-blue',text:'',time:'Just now',type:'doc',docName,docMeta,docIcon,docBadge,docBadgeLabel});
  t.sharedDocs.push({name:docName,meta:'Shared by Paul L · Just now',icon:docIcon,read:false,source});
  t.preview='You shared: '+docName;t.time='Just now';
  closeModal();
  renderChat(t);
  renderThreadList();
  if(col3Tab==='docs')renderCol3(t);
}

function sendMsg(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!activeThread)return;
  const t=THREADS.find(x=>x.id===activeThread);
  t.messages.push({id:'new'+Date.now(),from:'pl',name:'Paul L',av:'av-blue',text,time:'Just now',type:'text'});
  t.preview='You: '+text;t.time='Just now';
  input.value='';
  renderChat(t);renderThreadList();
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

renderThreadList();
</script>
