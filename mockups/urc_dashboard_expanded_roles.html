
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:15px;color:var(--color-text-primary)}
.app{display:flex;height:680px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.sidebar{width:210px;background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:14px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.sidebar-logo{font-size:13px;font-weight:500}
.sidebar-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:1px}
.role-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:var(--border-radius-md);margin-top:6px;background:var(--color-background-info);color:var(--color-text-info)}
.nav{padding:6px 0;flex:1;overflow-y:auto}
.nav-section{font-size:10px;color:var(--color-text-tertiary);padding:8px 16px 4px;text-transform:uppercase;letter-spacing:0.05em}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:12px;color:var(--color-text-secondary);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--color-background-tertiary);color:var(--color-text-primary)}
.nav-item.active{color:var(--color-text-primary);font-weight:500;border-left:2px solid #378ADD;background:var(--color-background-primary)}
.nav-item i{font-size:15px}
.role-switcher{padding:10px 12px;border-top:0.5px solid var(--color-border-tertiary)}
.role-switcher label{font-size:10px;color:var(--color-text-tertiary);display:block;margin-bottom:4px}
.role-switcher select{width:100%;font-size:11px;padding:4px 6px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:12px 18px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h2{font-size:15px;font-weight:500}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)}
.avatar{width:28px;height:28px;border-radius:50%;background:#B5D4F4;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:16px 18px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-label{font-size:10px;color:var(--color-text-tertiary);margin-bottom:3px}
.stat-val{font-size:20px;font-weight:500}
.stat-val.blue{color:#185FA5}.stat-val.green{color:#3B6D11}.stat-val.amber{color:#BA7517}.stat-val.red{color:#A32D2D}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.card-title{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-title-action{font-size:10px;color:#185FA5;cursor:pointer;font-weight:400}
.fix-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.fix-row:last-child{border-bottom:none}
.fix-date{width:70px;color:var(--color-text-tertiary);font-size:10px;flex-shrink:0}
.fix-teams{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fix-venue{width:130px;color:var(--color-text-secondary);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:9px;padding:2px 7px;border-radius:var(--border-radius-md);flex-shrink:0}
.b-full{background:#EAF3DE;color:#27500A}
.b-part{background:#FAEEDA;color:#633806}
.b-vac{background:#FCEBEB;color:#791F1F}
.b-info{background:#E6F1FB;color:#0C447C}
.b-gray{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
.alert-list{display:flex;flex-direction:column;gap:6px}
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--border-radius-md);font-size:11px;line-height:1.5}
.alert-crit{background:#FCEBEB;color:#501313;border:0.5px solid #F09595}
.alert-warn{background:#FAEEDA;color:#412402;border:0.5px solid #FAC775}
.alert-info{background:#E6F1FB;color:#042C53;border:0.5px solid #85B7EB}
.alert-item i{font-size:14px;margin-top:1px;flex-shrink:0}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.panel-role{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:11px}
.panel-role-label{color:var(--color-text-secondary);font-size:10px}
.panel-role-name{font-weight:500;font-size:11px;margin-top:1px}
.panel-role.filled{border-color:#C0DD97;background:#EAF3DE}
.panel-role.empty{border-color:#F09595;background:#FCEBEB}
.panel-role.empty .panel-role-name{color:#A32D2D}
.avail-bars{display:flex;flex-direction:column;gap:5px}
.avail-row{display:flex;align-items:center;gap:8px;font-size:11px}
.avail-name{width:100px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avail-bar-wrap{flex:1;height:8px;background:var(--color-background-secondary);border-radius:4px;overflow:hidden}
.avail-bar{height:100%;border-radius:4px}
.bar-green{background:#639922}.bar-amber{background:#BA7517}.bar-red{background:#E24B4A}
.avail-pct{width:28px;text-align:right;color:var(--color-text-tertiary);font-size:10px}
.my-next{display:flex;flex-direction:column;gap:8px}
.next-fix{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.next-fix-label{font-size:10px;color:var(--color-text-tertiary);margin-bottom:2px}
.next-fix-name{font-size:13px;font-weight:500}
.next-fix-meta{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.doc-alert{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);font-size:11px}
.doc-alert i{color:#185FA5;font-size:15px}
.avail-prompt{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:var(--border-radius-md);border:0.5px solid #FAC775;background:#FAEEDA;font-size:11px;color:#412402}
</style>

<h2 class="sr-only">URC Match Official Platform — expanded dashboard with full role system</h2>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">URC Officials</div>
      <div class="sidebar-sub">Match Management Platform</div>
      <span class="role-badge" id="role-label">Admin / Booker</span>
    </div>
    <nav class="nav">
      <div class="nav-section">Main</div>
      <div class="nav-item active"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard</div>
      <div class="nav-item"><i class="ti ti-ball-football" aria-hidden="true"></i> Fixtures</div>
      <div class="nav-item"><i class="ti ti-calendar" aria-hidden="true"></i> Availability</div>
      <div class="nav-item"><i class="ti ti-clipboard-list" aria-hidden="true"></i> Appointments</div>
      <div class="nav-section">Communication</div>
      <div class="nav-item"><i class="ti ti-message-2" aria-hidden="true"></i> Messaging</div>
      <div class="nav-item"><i class="ti ti-file-description" aria-hidden="true"></i> MD Docs</div>
      <div class="nav-section" id="admin-section">Admin</div>
      <div class="nav-item" id="nav-officials"><i class="ti ti-users" aria-hidden="true"></i> Officials</div>
      <div class="nav-item" id="nav-selectors"><i class="ti ti-adjustments" aria-hidden="true"></i> Selectors</div>
      <div class="nav-item" id="nav-reports"><i class="ti ti-chart-bar" aria-hidden="true"></i> Reports</div>
    </nav>
    <div class="role-switcher">
      <label>Demo as role</label>
      <select id="role-select" onchange="switchRole(this.value)">
        <optgroup label="Management">
          <option value="admin">Admin / Booker</option>
          <option value="manager">Manager / Approver</option>
          <option value="selector">Selector</option>
          <option value="viewer">Viewer</option>
        </optgroup>
        <optgroup label="Match Officials">
          <option value="referee">Referee</option>
          <option value="ar">Assistant Referee (AR1/2)</option>
          <option value="ar4">AR4</option>
          <option value="ar5">AR5</option>
          <option value="tmo">TMO</option>
          <option value="tmo_op">TMO Operator</option>
          <option value="slm">Sideline Manager (SLM)</option>
          <option value="timekeeper">Timekeeper</option>
          <option value="citing">Citing Commissioner</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="screen-title">Dashboard</h2>
      <div class="user-chip">
        <div class="avatar" id="user-avatar">PL</div>
        <span id="user-name">Paul L — Admin</span>
      </div>
    </div>

    <div class="content" id="dash-content">
      <!-- injected by JS -->
    </div>
  </div>
</div>

<script>
const roles={
  admin:{label:'Admin / Booker',avatar:'PL',name:'Paul L — Admin',adminNav:true},
  manager:{label:'Manager / Approver',avatar:'TH',name:'Tappe H — Manager',adminNav:true},
  selector:{label:'Selector',avatar:'CC',name:'Charl C — Selector',adminNav:false},
  viewer:{label:'Viewer',avatar:'JW',name:'Jo W — Viewer',adminNav:false},
  referee:{label:'Referee',avatar:'FM',name:'Frank Murphy — Referee',adminNav:false},
  ar:{label:'Assistant Referee',avatar:'AP',name:'Andrea P — AR',adminNav:false},
  ar4:{label:'AR4',avatar:'CR',name:'C. Ridley — AR4',adminNav:false},
  ar5:{label:'AR5',avatar:'SW',name:'S. Walker — AR5',adminNav:false},
  tmo:{label:'TMO',avatar:'JN',name:'Joy Neville — TMO',adminNav:false},
  tmo_op:{label:'TMO Operator',avatar:'MJ',name:'M. Jones — TMO Op',adminNav:false},
  slm:{label:'Sideline Manager',avatar:'DB',name:'D. Brown — SLM',adminNav:false},
  timekeeper:{label:'Timekeeper',avatar:'RK',name:'R. Kelly — Timekeeper',adminNav:false},
  citing:{label:'Citing Commissioner',avatar:'GG',name:'G. Garner — Citing',adminNav:false},
};

function switchRole(r){
  const cfg=roles[r];
  document.getElementById('role-label').textContent=cfg.label;
  document.getElementById('user-avatar').textContent=cfg.avatar;
  document.getElementById('user-name').textContent=cfg.name;
  const adminSec=document.getElementById('admin-section');
  const navOff=document.getElementById('nav-officials');
  const navSel=document.getElementById('nav-selectors');
  const navRep=document.getElementById('nav-reports');
  const show=cfg.adminNav;
  adminSec.style.display=show?'':'none';
  navOff.style.display=show?'':'none';
  navSel.style.display=show?'':'none';
  navRep.style.display=show?'':'none';
  renderDash(r);
}

function renderDash(r){
  const c=document.getElementById('dash-content');
  if(r==='admin'||r==='manager'){
    c.innerHTML=adminDash(r);
  } else if(r==='selector'){
    c.innerHTML=selectorDash();
  } else if(r==='citing'){
    c.innerHTML=citingDash();
  } else {
    c.innerHTML=officialDash(r);
  }
}

function badge(type,text){
  const cls={full:'b-full',part:'b-part',vac:'b-vac',info:'b-info',gray:'b-gray'};
  return `<span class="badge ${cls[type]||'b-gray'}">${text}</span>`;
}

function alertItem(type,icon,text){
  return `<div class="alert-item alert-${type}"><i class="ti ti-${icon}" aria-hidden="true"></i><span>${text}</span></div>`;
}

function panelRole(label,name,filled){
  return `<div class="panel-role ${filled?'filled':'empty'}"><div><div class="panel-role-label">${label}</div><div class="panel-role-name">${filled?name:'Vacant'}</div></div>${filled?'<i class="ti ti-check" style="color:#3B6D11;font-size:14px" aria-hidden="true"></i>':'<i class="ti ti-alert-circle" style="color:#A32D2D;font-size:14px" aria-hidden="true"></i>'}</div>`;
}

function adminDash(r){
  const approvals=r==='manager'?`<div class="card">
    <div class="card-title">Pending approvals <span class="badge b-part" style="font-size:9px">3</span></div>
    <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Glasgow v Edinburgh</div>${badge('part','Partial panel')}<button class="btn" style="font-size:10px;padding:3px 8px;margin-left:4px">Approve</button></div>
    <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Munster v Connacht</div>${badge('vac','Vacant')}<button class="btn" style="font-size:10px;padding:3px 8px;margin-left:4px">Review</button></div>
  </div>`:'';
  return `
  <div class="stat-grid">
    <div class="stat"><div class="stat-label">Upcoming fixtures</div><div class="stat-val blue">18</div></div>
    <div class="stat"><div class="stat-label">Fully appointed</div><div class="stat-val green">12</div></div>
    <div class="stat"><div class="stat-label">Partial panels</div><div class="stat-val amber">4</div></div>
    <div class="stat"><div class="stat-label">Vacant</div><div class="stat-val red">2</div></div>
  </div>
  <div class="alert-list" style="margin-bottom:12px">
    ${alertItem('crit','alert-triangle','Munster v Connacht (Sun 18 May) — no officials appointed. 72hrs to kick-off.')}
    ${alertItem('warn','clock','Wayne Barnes marked unavailable 17–19 May. Glasgow v Edinburgh referee now vacant.')}
    ${alertItem('warn','file-alert','3 officials have not opened their Round 19 match day pack.')}
    ${alertItem('info','check','Lions v Sharks — full panel confirmed. MD Doc delivered.')}
  </div>
  <div class="two-col">
    <div>
      <div class="card">
        <div class="card-title">This weekend's fixtures <span class="card-title-action">View all</span></div>
        <div class="fix-row"><div class="fix-date">Fri 16 May</div><div class="fix-teams">Scarlets v Cardiff</div>${badge('full','Full panel')}</div>
        <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Leinster v Ulster</div>${badge('full','Full panel')}</div>
        <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Glasgow v Edinburgh</div>${badge('part','Partial')}</div>
        <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Lions v Sharks</div>${badge('full','Full panel')}</div>
        <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Munster v Connacht</div>${badge('vac','Vacant')}</div>
      </div>
      ${approvals}
    </div>
    <div>
      <div class="card">
        <div class="card-title">Glasgow v Edinburgh — panel status</div>
        <div class="panel-grid">
          ${panelRole('Referee','B. O\'Keeffe',true)}
          ${panelRole('AR1','',false)}
          ${panelRole('AR2','',false)}
          ${panelRole('AR4','C. Ridley',true)}
          ${panelRole('AR5','',false)}
          ${panelRole('TMO','J. Neville',true)}
          ${panelRole('TMO Operator','',false)}
          ${panelRole('SLM','D. Brown',true)}
          ${panelRole('Timekeeper','',false)}
          ${panelRole('Citing Comm.','G. Garner',true)}
        </div>
      </div>
      <div class="card">
        <div class="card-title">Official availability — next 7 days</div>
        <div class="avail-bars">
          <div class="avail-row"><div class="avail-name">Referees</div><div class="avail-bar-wrap"><div class="avail-bar bar-amber" style="width:60%"></div></div><div class="avail-pct">60%</div></div>
          <div class="avail-row"><div class="avail-name">AR1/AR2</div><div class="avail-bar-wrap"><div class="avail-bar bar-green" style="width:80%"></div></div><div class="avail-pct">80%</div></div>
          <div class="avail-row"><div class="avail-name">AR4/AR5</div><div class="avail-bar-wrap"><div class="avail-bar bar-green" style="width:75%"></div></div><div class="avail-pct">75%</div></div>
          <div class="avail-row"><div class="avail-name">TMO</div><div class="avail-bar-wrap"><div class="avail-bar bar-green" style="width:85%"></div></div><div class="avail-pct">85%</div></div>
          <div class="avail-row"><div class="avail-name">TMO Operator</div><div class="avail-bar-wrap"><div class="avail-bar bar-amber" style="width:55%"></div></div><div class="avail-pct">55%</div></div>
          <div class="avail-row"><div class="avail-name">SLM</div><div class="avail-bar-wrap"><div class="avail-bar bar-green" style="width:90%"></div></div><div class="avail-pct">90%</div></div>
          <div class="avail-row"><div class="avail-name">Timekeepers</div><div class="avail-bar-wrap"><div class="avail-bar bar-red" style="width:40%"></div></div><div class="avail-pct">40%</div></div>
          <div class="avail-row"><div class="avail-name">Citing Comm.</div><div class="avail-bar-wrap"><div class="avail-bar bar-green" style="width:70%"></div></div><div class="avail-pct">70%</div></div>
        </div>
      </div>
    </div>
  </div>`;
}

function selectorDash(){
  return `
  <div class="stat-grid">
    <div class="stat"><div class="stat-label">Fixtures to select</div><div class="stat-val blue">6</div></div>
    <div class="stat"><div class="stat-label">Selections made</div><div class="stat-val green">4</div></div>
    <div class="stat"><div class="stat-label">Awaiting approval</div><div class="stat-val amber">2</div></div>
    <div class="stat"><div class="stat-label">Conflicts flagged</div><div class="stat-val red">1</div></div>
  </div>
  <div class="alert-list" style="margin-bottom:12px">
    ${alertItem('warn','alert-triangle','Conflict flag: B. O\'Keeffe selected for Glasgow v Edinburgh — officiated Edinburgh last 2 rounds.')}
    ${alertItem('info','clock','Selection deadline for Round 19: Thursday 15 May, 17:00.')}
  </div>
  <div class="card">
    <div class="card-title">My selections — Round 19</div>
    <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Leinster v Ulster</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Ref: F. Murphy</div>${badge('full','Submitted')}</div>
    <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Glasgow v Edinburgh</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Ref: B. O'Keeffe ⚠</div>${badge('part','Review needed')}</div>
    <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Lions v Sharks</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Ref: A. Brace</div>${badge('full','Submitted')}</div>
    <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Munster v Connacht</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Ref: —</div>${badge('vac','Not selected')}</div>
  </div>
  <div class="card">
    <div class="card-title">Available referees — weekend of 17 May</div>
    <div class="fix-row"><div class="fix-teams">Frank Murphy</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Last: Leinster v Ulster R17</div>${badge('full','Available')}</div>
    <div class="fix-row"><div class="fix-teams">Nika Amashukeli</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Last: Bulls v Stormers R17</div>${badge('full','Available')}</div>
    <div class="fix-row"><div class="fix-teams">Matthew Carley</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Last: Munster v Connacht R18</div>${badge('full','Available')}</div>
    <div class="fix-row"><div class="fix-teams">Wayne Barnes</div><div style="flex:1;font-size:11px;color:var(--color-text-secondary)">Last: Scarlets v Cardiff R18</div>${badge('vac','Unavailable')}</div>
  </div>`;
}

function citingDash(){
  return `
  <div class="stat-grid">
    <div class="stat"><div class="stat-label">Assigned fixtures</div><div class="stat-val blue">3</div></div>
    <div class="stat"><div class="stat-label">Reports submitted</div><div class="stat-val green">1</div></div>
    <div class="stat"><div class="stat-label">Pending</div><div class="stat-val amber">2</div></div>
    <div class="stat"><div class="stat-label">Active citations</div><div class="stat-val red">1</div></div>
  </div>
  <div class="alert-list" style="margin-bottom:12px">
    ${alertItem('warn','alert-triangle','Citing report for Bulls v Stormers due by Monday 19 May, 10:00.')}
    ${alertItem('info','file-description','Match day pack for Lions v Sharks available to download.')}
  </div>
  <div class="my-next">
    <div class="next-fix"><div class="next-fix-label">Next assignment</div><div class="next-fix-name">Lions v Sharks</div><div class="next-fix-meta">Sun 18 May · Ellis Park, Johannesburg · 15:00 local</div></div>
    <div class="doc-alert"><i class="ti ti-file-description" aria-hidden="true"></i><span>Match day pack ready — <strong>Lions v Sharks</strong></span><span class="badge b-info" style="margin-left:auto">Unread</span></div>
    <div class="card" style="margin-bottom:0">
      <div class="card-title">My citing assignments — Round 19</div>
      <div class="fix-row"><div class="fix-date">Fri 16 May</div><div class="fix-teams">Scarlets v Cardiff</div>${badge('full','Report submitted')}</div>
      <div class="fix-row"><div class="fix-date">Sun 18 May</div><div class="fix-teams">Lions v Sharks</div>${badge('part','Upcoming')}</div>
      <div class="fix-row"><div class="fix-date">Sat 17 May</div><div class="fix-teams">Bulls v Stormers</div>${badge('vac','Report due')}</div>
    </div>
  </div>`;
}

function officialDash(r){
  const roleLabels={
    referee:'Referee',ar:'Assistant Referee',ar4:'AR4',ar5:'AR5',
    tmo:'TMO',tmo_op:'TMO Operator',slm:'Sideline Manager',timekeeper:'Timekeeper'
  };
  const rl=roleLabels[r]||'Official';
